name: verify-current-formal-publication-artifacts

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formal-publication-artifacts-${{ github.ref }}
  cancel-in-progress: true

env:
  PNP_CORE_COMMIT: 752be777ca2c366aa16bb8ff4bf9120a984f25b6
  PNP_SOURCE_DIR: ${{ github.workspace }}/pnp

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: pnplabs
    steps:
      - name: Check out companion repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          path: pnplabs

      - name: Check out exact reviewed core merge
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          repository: aisknab/pnp
          ref: ${{ env.PNP_CORE_COMMIT }}
          fetch-depth: 0
          fetch-tags: true
          path: pnp

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"

      - name: Install PDF metadata checker
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Verify exact core artifacts and release seal without writing
        run: node tools/sync-public-access-docs.mjs --check

      - name: Verify cross-repository coordinates
        run: node tools/check-cross-repo-targets.mjs --require-source

      - name: Run focused artifact tests
        run: |
          node --test tests/unit/formal-publication-artifacts*.test.mjs
          node --test tests/audit-targets/*.test.mjs

      - name: Enforce read-only workflow
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain)"
